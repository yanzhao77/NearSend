<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">NearSend Windows transfer screen</title><desc id="desc">A Windows desktop layout with sidebar, transfer task list and detailed stage progress.</desc>
